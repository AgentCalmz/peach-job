name: TeamPeach job collection (every 4 hours)

on:
  schedule:
    - cron: "17 */4 * * *"
      timezone: "Africa/Lagos"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teampeach-jobs-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
      CLOUDFLARE_INGEST_TOKEN: ${{ secrets.CLOUDFLARE_INGEST_TOKEN }}
      COLLECTOR_CONCURRENCY: "12"
      MAX_BOARDS_PER_RUN: "0"
    steps:
      - name: Check out collector
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate collector syntax and tests
        run: |
          python -m py_compile collector/collect.py
          python -m unittest discover -s tests -v
      - name: Discover employers, scan ATS boards and sync Cloudflare D1
        run: python collector/collect.py
